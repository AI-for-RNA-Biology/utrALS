# SLURM settings used by pipeline/slurm/submit.sh. Adapt to your cluster; every value can also be
# overridden by exporting the variable before calling submit.sh.

: "${SLURM_ACCOUNT:=gratis}"
: "${SLURM_EXTRA_OPTS:=}"        # any other sbatch options, e.g. "--partition=epyc2 --wckey=dbmr_luisierlab"
: "${SLURM_MAX_PARALLEL:=100}"   # maximum number of array tasks running at the same time

# Resources per step: "CPUS MEMORY TIME" (step names as in the datasets' run_all.sh)
RES_download="4 16G 02:00:00"
RES_star="12 64G 06:00:00"
RES_kallisto="8 32G 02:00:00"
RES_featurecounts="4 32G 01:00:00"
RES_aggregate="1 16G 00:30:00"
RES_genes_preprocessing="1 32G 02:00:00"
RES_bulkapa="4 64G 06:00:00"
RES_clip_integration="1 8G 04:00:00"
RES_clip_per_patient_integration="1 8G 04:00:00"
RES_m6a_integration="1 8G 04:00:00"
RES_clip_stop_codon_integration="1 8G 04:00:00"
RES_m6a_stop_codon_integration="1 8G 04:00:00"
RES_rnamod_stop_codon_integration="1 8G 04:00:00"
RES_clip_analysis="1 32G 02:00:00"
RES_m6a_analysis="1 32G 02:00:00"
RES_clip_merge_welch="1 64G 02:00:00"
RES_clip_per_patient_merge_welch="1 64G 04:00:00"
RES_rnamod_merge_welch="1 16G 01:00:00"
RES_default="1 8G 02:00:00"     # any step not listed above
