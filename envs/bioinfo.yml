# featureCounts and RSeQC (infer_experiment.py) of the pipeline, MN_diff m6A-switch scripts (scripts/m6a_switch) and
# kernel of the Figure_m6A_lncRNA_switch notebook. Versions are those the results were produced with.
# After creating it, install utrals (see envs/README.md):
#   conda run -n bioinfo pip install --no-deps --no-build-isolation -e .
name: bioinfo
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - subread=2.0.6
  - pip:
      - numpy==2.4.0
      - pandas==2.3.3
      - scipy==1.18.1
      - statsmodels==0.15.0
      - matplotlib==3.10.8
      - seaborn==0.13.2
      - pysam==0.23.3
      - viennarna==2.7.2
      - rseqc==5.0.4
      - ipykernel==7.3.0
