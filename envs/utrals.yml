# Python analyses of the pipeline (bulkapa, genes_preprocessing, CLIP integration, MN_diff scripts) and kernel of the
# notebooks (all but Figure_m6A_lncRNA_switch). Versions are those the results were produced with.
# After creating it, install the lab packages and utrals (see envs/README.md):
#   conda run -n utrals pip install --no-deps -r envs/lab_packages.txt
#   conda run -n utrals pip install --no-deps --no-build-isolation -e .
name: utrals
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.23.5
  - pandas=1.5.1
  - statsmodels=0.14.2
  - scikit-learn=1.5.1
  - matplotlib-base=3.8.0
  - matplotlib-venn=0.11.7
  - networkx=3.2
  - requests=2.28.2
  - pyyaml=6.0.2
  - ipykernel=6.16.0
  # R and limma: quantile normalisation of bulkanalysis (genes_preprocessing, bulkapa), called through rpy2
  - r-base=4.2.0
  - bioconductor-limma=3.54.0
  - rpy2=3.5.10
  - pip:
      - scipy==1.11.2
      - seaborn==0.11.2
      - anndata==0.9.2
      - scanpy==1.9.5
      - statannotations==0.5.0
      - gseapy==1.2.1
      - gtfparse==1.3.0
      - polars==0.19.19
      - pyarrow==14.0.2
      - joblib==1.5.2
      - xlsxwriter==3.2.9
